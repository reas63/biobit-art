<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Arte Biobit</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #34d399;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 2.8rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        header p {
            color: #94a3b8;
            margin-top: 0.8rem;
            font-size: 1.2rem;
        }
        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-link {
            background-color: var(--card-bg);
            color: var(--accent-color);
            padding: 0.8rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #334155;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-link:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }
        .info-badge {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
        }
        .art-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .art-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.6);
        }
        .art-img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: #334155;
        }
        .art-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .art-card:hover .art-img {
            transform: scale(1.05);
        }
        .art-info {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .art-title {
            font-size: 1.35rem;
            margin: 0 0 0.5rem 0;
            color: #f1f5f9;
            font-weight: 700;
        }
        .art-price {
            font-size: 1.2rem;
            color: var(--success-color);
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .art-desc {
            color: #94a3b8;
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: auto;
        }
        .pay-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.25);
            transition: opacity 0.3s, transform 0.2s;
        }
        .pay-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .download-site-btn {
            background-color: #334155;
            color: var(--success-color);
            border: 1px solid #475569;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: background 0.3s;
        }
        .download-site-btn:hover {
            background-color: #475569;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            grid-column: 1 / -1;
            padding: 4rem;
            font-size: 1.25rem;
        }
        footer {
            text-align: center;
            padding: 3.5rem;
            color: #64748b;
            border-top: 1px solid #334155;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galeria de Arte Biobit</h1>
        <p>Exposição exclusiva de obras de arte digital e contemporânea</p>
    </header>

    <div class="container">
        <div class="nav-bar">
            <a href="./admin/" class="admin-link">⚙️ Gerir / Adicionar / Apagar Obras (CMS)</a>
            <span class="info-badge">✨ Feed dinâmico em tempo real</span>
        </div>

        <div class="gallery-grid" id="gallery-container">
            <div class="loading">A carregar galeria de obras...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Galeria de Arte Biobit. Todos os direitos reservados.</p>
    </footer>

    <script>
        async function loadGallery() {
            const container = document.getElementById('gallery-container');
            const repo = "reas63/artesbiobit";
            const apiURL = `https://api.github.com/repos/${repo}/contents/content/artes`;

            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Sem obras ainda');
                
                const files = await response.json();
                if (!Array.isArray(files)) throw new Error('Formato inválido');

                const mdFiles = files.filter(file => file.name && file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    container.innerHTML = '<div class="loading">Ainda não existem obras publicadas. Aceda ao painel de administração para adicionar a sua primeira obra!</div>';
                    return;
                }

                container.innerHTML = '';

                for (const file of mdFiles) {
                    try {
                        const fileRes = await fetch(file.download_url);
                        const markdownText = await fileRes.text();
                        
                        const parsedData = parseMarkdownFrontmatter(markdownText);
                        
                        if (parsedData) {
                            const card = document.createElement('div');
                            card.className = 'art-card';
                            
                            const imgSrc = parsedData.image || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500';
                            const title = parsedData.title || 'Obra sem título';
                            const price = parsedData.price ? `${parsedData.price} €` : 'Sob consulta';
                            const desc = parsedData.body || 'Sem descrição disponível.';
                            const payLink = parsedData.payment_link || 'http://mpago.la/xzWR';

                            card.innerHTML = `
                                <div class="art-img-container">
                                    <img src="${imgSrc}" alt="${title}" class="art-img">
                                </div>
                                <div class="art-info">
                                    <h3 class="art-title">${title}</h3>
                                    <div class="art-price">${price}</div>
                                    <p class="art-desc">${desc}</p>
                                    <div class="btn-group">
                                        <a href="${payLink}" target="_blank" class="pay-btn">💳 Comprar com Mercado Pago</a>
                                        <a href="./sucesso.html" class="download-site-btn">📥 Já paguei / Descarregar Ficheiro</a>
                                    </div>
                                </div>
                            `;
                            container.appendChild(card);
                        }
                    } catch (err) {
                        console.error("Erro ao carregar obra:", err);
                    }
                }
            } catch (error) {
                console.error("Erro na galeria:", error);
                container.innerHTML = '<div class="loading">Ainda não há obras publicadas ou a galeria está vazia. Adicione obras pelo painel de administração!</div>';
            }
        }

        function parseMarkdownFrontmatter(text) {
            const match = text.match(/^---\s*([\s\S]*?)\s*---([\s\S]*)$/);
            if (!match) return null;

            const frontmatterLines = match[1].split('\n');
            const data = {};
            
            frontmatterLines.forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const key = line.substring(0, colonIndex).trim();
                    let value = line.substring(colonIndex + 1).trim();
                    value = value.replace(/^['"](.*)['"]$/, '$1');
                    data[key] = value;
                }
            });

            data.body = match[2].trim();
            return data;
        }

        loadGallery();
    </script>

</body>
</html>

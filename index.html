<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Arte Biobit</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #34d399;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        header p {
            color: #94a3b8;
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-link {
            display: inline-block;
            margin-bottom: 2rem;
            background-color: var(--card-bg);
            color: var(--accent-color);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #334155;
            transition: background 0.3s;
        }
        .admin-link:hover {
            background-color: #334155;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .art-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        .art-card:hover {
            transform: translateY(-5px);
        }
        .art-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #334155;
        }
        .art-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .art-title {
            font-size: 1.25rem;
            margin: 0 0 0.5rem 0;
            color: #f1f5f9;
        }
        .art-price {
            font-size: 1.1rem;
            color: var(--success-color);
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .art-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: auto;
        }
        .pay-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 0.7rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: opacity 0.3s;
        }
        .pay-btn:hover {
            opacity: 0.9;
        }
        .download-site-btn {
            background-color: #334155;
            color: var(--success-color);
            border: 1px solid #475569;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: background 0.3s;
        }
        .download-site-btn:hover {
            background-color: #475569;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
        }
        footer {
            text-align: center;
            padding: 3rem;
            color: #64748b;
            border-top: 1px solid #334155;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galeria de Arte Biobit</h1>
        <p>Exposição exclusiva de obras de arte digital e contemporânea</p>
    </header>

    <div class="container">
        <a href="./admin/" class="admin-link">⚙️ Aceder ao Painel de Administração (CMS)</a>

        <div class="gallery-grid" id="gallery-container">
            <div class="loading">A carregar obras da galeria...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Galeria de Arte Biobit. Todos os direitos reservados.</p>
    </footer>

    <script>
        async function loadGallery() {
            const container = document.getElementById('gallery-container');
            const repo = "reas63/artesbiobit";
            const apiURL = `https://api.github.com/repos/${repo}/contents/content/artes`;

            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Sem obras ainda');
                
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    container.innerHTML = '<div class="loading">Ainda não existem obras publicadas. Aceda ao painel de administração para adicionar a sua primeira obra!</div>';
                    return;
                }

                container.innerHTML = '';

                for (const file of mdFiles) {
                    const fileRes = await fetch(file.download_url);
                    const markdownText = await fileRes.text();
                    
                    const parsedData = parseMarkdownFrontmatter(markdownText);
                    
                    if (parsedData) {
                        const card = document.createElement('div');
                        card.className = 'art-card';
                        
                        const imgSrc = parsedData.image || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500';
                        const title = parsedData.title || 'Obra sem título';
                        const price = parsedData.price ? `${parsedData.price} €` : 'Sob consulta';
                        const desc = parsedData.body || 'Sem descrição disponível.';
                        const payLink = parsedData.payment_link || 'http://mpago.la/xzWR';

                        card.innerHTML = `
                            <img src="${imgSrc}" alt="${title}" class="art-img">
                            <div class="art-info">
                                <h3 class="art-title">${title}</h3>
                                <div class="art-price">${price}</div>
                                <p class="art-desc">${desc}</p>
                                <div class="btn-group">
                                    <a href="${payLink}" target="_blank" class="pay-btn">💳 Comprar com Mercado Pago</a>
                                    <a href="./sucesso.html" class="download-site-btn">📥 Já paguei / Descarregar Ficheiro</a>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="loading">Ainda não há obras publicadas ou a galeria está vazia. Adicione obras pelo painel de administração!</div>';
            }
        }

        function parseMarkdownFrontmatter(text) {
            const match = text.match(/^---\s*([\s\S]*?)\s*---([\s\S]*)$/);
            if (!match) return null;

            const frontmatterLines = match[1].split('\n');
            const data = {};
            
            frontmatterLines.forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const key = line.substring(0, colonIndex).trim();
                    let value = line.substring(colonIndex + 1).trim();
                    value = value.replace(/^['"](.*)['"]$/, '$1');
                    data[key] = value;
                }
            });

            data.body = match[2].trim();
            return data;
        }

        loadGallery();
    </script>

</body>
</html>

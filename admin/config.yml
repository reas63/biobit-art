backend:
  name: github
  repo: reas63/artesbiobit
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "artes"
    label: "Obras de Arte"
    folder: "content/artes"
    create: true
    fields:
      - {label: "Título da Obra", name: "title", widget: "string"}
      - {label: "Preço", name: "price", widget: "string"}
      - {label: "Link do PayPal (ex: https://paypal.me/seuutilizador)", name: "payment_link", widget: "string", required: false}
      - {label: "Imagem da Obra (Upload do Telemóvel/PC)", name: "image", widget: "image"}
      - {label: "Descrição", name: "body", widget: "markdown", required: false}
